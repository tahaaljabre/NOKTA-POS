<div id="admin-backup-admin" class="admin-panel">
            <h2 data-i18n="admin_backup">💾 النسخ الاحتياطي والاستعادة</h2>
            <p style="color:var(--text-light);margin-bottom:20px;" data-i18n="backup_desc">تصدير كامل للبيانات أو استيراد نسخة سابقة بأمان</p>

            <!-- Export Section -->
            <div style="background:var(--card-bg,#fff);border-radius:12px;padding:24px;margin-bottom:20px;border:1px solid var(--border-color,#eee);">
              <h3 style="margin:0 0 16px;display:flex;align-items:center;gap:8px;">
                <span style="font-size:1.5rem">⬇️</span>
                <span data-i18n="backup_export_title">تصدير البيانات (Export)</span>
              </h3>
              <p style="color:var(--text-light);font-size:0.9rem;margin-bottom:16px;" data-i18n="backup_export_desc">تحميل جميع بيانات النظام كملف JSON للحفظ أو النقل</p>
              <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button class="btn btn-save" id="btn-export-backup" onclick="exportBackup()" style="min-width:160px;">
                  ⬇️ <span data-i18n="backup_export_btn">تصدير الكل</span>
                </button>
                <button class="btn btn-save" id="btn-download-database-backup" onclick="downloadFullDatabaseBackup()" style="min-width:160px;">
                  💾 <span data-i18n="backup_database_btn">تنزيل قاعدة النظام كاملة</span>
                </button>
                <button class="btn btn-primary" onclick="exportOrdersOnly()" style="min-width:160px;">
                  📊 <span data-i18n="backup_export_orders">تصدير الطلبات فقط</span>
                </button>
              </div>
            </div>

            <!-- Import Section -->
            <div style="background:var(--card-bg,#fff);border-radius:12px;padding:24px;border:1px solid var(--border-color,#eee);">
              <h3 style="margin:0 0 16px;display:flex;align-items:center;gap:8px;">
                <span style="font-size:1.5rem">⬆️</span>
                <span data-i18n="backup_restore_title">استعادة البيانات (Restore)</span>
              </h3>
              <p style="color:#e74c3c;font-size:0.9rem;margin-bottom:16px;" data-i18n="backup_restore_warn">⚠️ تحذير: ستتم استبدال البيانات الحالية بالنسخة المختارة. تأكد من عمل نسخة حديثة أولاً.</p>
              <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
                <label class="btn btn-primary" style="cursor:pointer;min-width:160px;text-align:center;">
                  📂 <span data-i18n="backup_choose_file">اختر ملف النسخة</span>
                  <input type="file" id="restore-file-input" accept=".json" style="display:none;" onchange="previewRestoreFile(this)">
                </label>
                <button class="btn" id="btn-restore-backup" onclick="restoreBackup()" disabled style="min-width:160px;background:#e74c3c;color:#fff;">
                  ⬆️ <span data-i18n="backup_restore_btn">استعادة البيانات</span>
                </button>
              </div>
              <div id="restore-preview" style="margin-top:16px;display:none;padding:12px;background:#f8f9fa;border-radius:8px;font-size:0.9rem;border:1px solid #dee2e6;"></div>
            </div>
          </div>
