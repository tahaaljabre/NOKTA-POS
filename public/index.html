  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      let refreshingForUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshingForUpdate) return;
        refreshingForUpdate = true;
        window.location.reload();
      });
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
        .then(reg => {
          console.log('SW registered:', reg.scope);
          reg.update();
        })
        .catch(err => console.error('SW registration failed:', err));

      // Listen for sync complete messages
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data.type === 'SYNC_COMPLETE') {
          showSyncStatus('synced');
          toast('تمت المزامنة بنجاح', 'success');
        }
      });
    }

    // Online/Offline detection
    window.addEventListener('online', () => {
      document.getElementById('offline-bar').classList.add('hidden');
      showSyncStatus('syncing');
      // Trigger background sync
      if ('serviceWorker' in navigator && 'SyncManager' in window) {
        navigator.serviceWorker.ready.then(reg => reg.sync.register('sync-orders'));
      }
    });

    window.addEventListener('offline', () => {
      document.getElementById('offline-bar').classList.remove('hidden');
      showSyncStatus('offline');
    });

    function showSyncStatus(status) {
      const el = document.getElementById('sync-status');
      if (status === 'online') el.textContent = '✓';
      else if (status === 'offline') el.textContent = '⚡';
      else if (status === 'syncing') el.textContent = '↻';
      else if (status === 'synced') el.textContent = '✓';
      el.className = 'sync-status ' + status;
    }
  </script>
