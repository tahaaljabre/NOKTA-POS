<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202a44">
  <title>NOKTA POS</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,"Segoe UI",sans-serif;background:#f5f7fb;color:#202a44;padding:24px}.card{width:min(100%,420px);text-align:center;background:#fff;border-radius:26px;padding:34px 26px;box-shadow:0 15px 45px #15223b1c}.mark{width:80px;height:80px;margin:0 auto 16px;border-radius:22px;background:#202a44 url('nokta-pos-icon.png') center/cover no-repeat}.brand{font-size:26px;font-weight:800;margin:0}.sub{color:#64748b;line-height:1.7;margin:10px 0 25px}label{text-align:right;display:block;font-size:14px;font-weight:700;margin-bottom:8px}input{direction:ltr;text-align:left;width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:14px;font-size:16px}input[aria-invalid="true"]{border-color:#b91c1c;outline-color:#b91c1c}button{width:100%;margin-top:14px;border:0;border-radius:12px;background:#18a999;color:white;font-size:16px;font-weight:700;padding:14px}.hint{font-size:12px;color:#64748b;line-height:1.6;margin-top:18px}.error{min-height:22px;color:#b91c1c;font-size:13px;margin:9px 0 0}.en{display:block;direction:ltr;font-size:12px;font-weight:400;color:#64748b;margin-top:3px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"></div>
    <h1 class="brand">NOKTA POS</h1>
    <p class="sub">أدخل رابط خادم نقطة البيع داخل المنشأة أو رابط Tailscale الآمن.<span class="en">Enter the local POS server or secure Tailscale URL.</span></p>
    <label for="server-url">رابط الخادم <span class="en">Server URL</span></label>
    <input id="server-url" inputmode="url" autocomplete="url" placeholder="http://192.168.1.50:3000">
    <p id="error" class="error" role="alert"></p>
    <button id="connect">اتصال / Connect</button>
    <p class="hint">مثال: http://192.168.1.50:3000<br>للعودة وتغيير الرابط استخدم زر الرجوع في الجهاز.<span class="en">Use the device Back button to change this URL.</span></p>
  </main>
  <script>
    const input = document.getElementById('server-url');
    const saved = localStorage.getItem('nokta_server_url');
    if (saved) input.value = saved;
    const error = document.getElementById('error');
    const connect = () => {
      let url = input.value.trim().replace(/\/$/, '');
      if (!/^https?:\/\//i.test(url)) url = `http://${url}`;
      try {
        const parsed = new URL(url);
        if (!parsed.hostname || !['http:', 'https:'].includes(parsed.protocol)) throw new Error('invalid');
      } catch {
        input.setAttribute('aria-invalid', 'true');
        error.textContent = 'الرابط غير صحيح / Invalid server URL';
        input.focus();
        return;
      }
      input.removeAttribute('aria-invalid');
      error.textContent = '';
      localStorage.setItem('nokta_server_url', url);
      window.location.assign(url);
    };
    document.getElementById('connect').onclick = connect;
    input.addEventListener('keydown', event => { if (event.key === 'Enter') connect(); });
  </script>
</body>
</html>
